name: SAST - CodeQL

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

jobs:

  codeql:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyze Code
        uses: github/codeql-action/analyze@v4
